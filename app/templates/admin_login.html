<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    {% include "_yandex_metrika.html" %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель — Топай в ТОП</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    {% if design_v2 %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/style-v2.css?v=20260811-3">
    {% else %}
        <link rel="stylesheet" href="/static/style.css?v=20260504-1">
    {% endif %}
</head>
<body{% if design_v2 %} class="admin-page"{% endif %}>
    <header class="topbar">
        <a href="/" class="brand"><img src="/static/logo.png" alt="Топай в ТОП" class="brand-logo"></a>
        <span class="muted" style="font-size:13px;">Админ-панель</span>
    </header>

    <main class="container">
        <div class="card narrow">
            <h1>Вход в админ-панель</h1>
            {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
            <form method="post" action="/admin/login">
                <label>
                    Логин
                    <input type="text" name="login" required value="{{ form.login or '' }}">
                </label>
                <label>
                    Пароль
                    <input type="password" name="password" required>
                </label>
                <button type="submit" class="btn-primary big full">Войти</button>
            </form>
        </div>
    </main>
</body>
</html>
